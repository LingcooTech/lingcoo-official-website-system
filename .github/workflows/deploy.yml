name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      database_reset_confirmation:
        description: 'Type RESET_OFFICIAL_DATABASE to rebuild the official website database'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: lingcoo-official-website-system
  GHCR_IMAGE: ghcr.io/lingcootech/lingcoo-official-website-system
  DEPLOY_HOST: 118.25.36.15
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/lingcoo-official-website-system
  DEPLOY_HEALTHCHECK_URL: https://www.lingcoo.com/ready

jobs:
  build-and-push-acr:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare image variables
        id: vars
        shell: bash
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          ACR_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "acr_image=${ACR_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Aliyun ACR
        shell: bash
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if printf '%s' "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY}" \
              --username "${ACR_USERNAME}" --password-stdin; then
              exit 0
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "ACR login failed after ${attempt} attempts"
              exit 1
            fi
            wait_s=$((attempt * 15))
            echo "ACR login failed (${attempt}/${max_attempts}); retrying in ${wait_s}s"
            sleep "${wait_s}"
          done

      - name: Build and push runtime image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.image_tag }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ steps.vars.outputs.acr_image }}:latest
            ${{ steps.vars.outputs.acr_image }}:${{ steps.vars.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.image_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  publish-ghcr:
    needs:
      - build-and-push-acr
    if: ${{ needs.build-and-push-acr.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        shell: bash
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if printf '%s' "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY}" \
              --username "${ACR_USERNAME}" --password-stdin; then
              exit 0
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "ACR login failed after ${attempt} attempts"
              exit 1
            fi
            wait_s=$((attempt * 15))
            echo "ACR login failed (${attempt}/${max_attempts}); retrying in ${wait_s}s"
            sleep "${wait_s}"
          done

      - name: Mirror ACR image to GHCR
        run: |
          : "${ACR_IMAGE:?ACR_IMAGE is required}"
          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            --tag "${GHCR_IMAGE}:${IMAGE_TAG}" \
            "${ACR_IMAGE}:${IMAGE_TAG}"
        env:
          ACR_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push-acr.outputs.image_tag }}

  deploy:
    needs:
      - build-and-push-acr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          DEPLOY_COMPOSE_FILE: docker-compose.prod.yml
          DATABASE_RESET_CONFIRMATION: ${{ inputs.database_reset_confirmation }}
          IMAGE_TAG: ${{ needs.build-and-push-acr.outputs.image_tag }}
          LINGCOO_OFFICIAL_IMAGE_NAME: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}
        run: |
          escape() {
            printf '%q' "$1"
          }

          remote_runner='deploy_script="$(mktemp /tmp/lingcoo-official-deploy.XXXXXX)"
          trap '\''rm -f "${deploy_script}"'\'' EXIT
          cat > "${deploy_script}"
          chmod 700 "${deploy_script}"
          sh "${deploy_script}"'

          remote_cmd="ACR_PASSWORD=$(escape "${ACR_PASSWORD}") \
             ACR_REGISTRY=$(escape "${ACR_REGISTRY}") \
             ACR_USERNAME=$(escape "${ACR_USERNAME}") \
             DATABASE_RESET_CONFIRMATION=$(escape "${DATABASE_RESET_CONFIRMATION}") \
             DEPLOY_COMPOSE_FILE=$(escape "${DEPLOY_COMPOSE_FILE}") \
             DEPLOY_HEALTHCHECK_URL=$(escape "${DEPLOY_HEALTHCHECK_URL}") \
             DEPLOY_PATH=$(escape "${DEPLOY_PATH}") \
             IMAGE_TAG=$(escape "${IMAGE_TAG}") \
             LINGCOO_OFFICIAL_IMAGE_NAME=$(escape "${LINGCOO_OFFICIAL_IMAGE_NAME}") \
             sh -c $(escape "${remote_runner}")"

          ssh_opts="-o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          attempt=1
          max_attempts=8

          while true; do
            set +e
            ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "${remote_cmd}" < ./scripts/deploy/deploy.sh
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 255 ]; then
              echo "deploy.sh exited with ${code}; not retrying"
              exit "$code"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "SSH transport failed after ${attempt} attempts"
              exit 255
            fi
            wait_s=$((attempt * 20))
            if [ "$wait_s" -gt 120 ]; then
              wait_s=120
            fi
            echo "SSH transport drop; retrying in ${wait_s}s"
            sleep "${wait_s}"
            attempt=$((attempt + 1))
          done
