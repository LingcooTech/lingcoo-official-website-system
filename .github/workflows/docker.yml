name: Docker Verify

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'package*.json'
      - 'public-web/**'
      - 'src/**'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Verify Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            VITE_API_BASE_URL=
          tags: lingcoo-official-website-system:verify

