name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lingcoo_official
          POSTGRES_USER: lingcoo_official
          POSTGRES_PASSWORD: lingcoo_official
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U lingcoo_official -d lingcoo_official"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://lingcoo_official:lingcoo_official@localhost:5438/lingcoo_official
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@lingcootech'
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run build:all
      - run: npm audit --omit=dev --audit-level=high
