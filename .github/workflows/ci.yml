name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lingcoo_official
          POSTGRES_USER: lingcoo_official
          POSTGRES_PASSWORD: lingcoo_official
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U lingcoo_official -d lingcoo_official"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://lingcoo_official:lingcoo_official@localhost:5438/lingcoo_official

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run build:all
      - run: npm audit --omit=dev --audit-level=high
