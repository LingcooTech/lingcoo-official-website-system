services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lingcoo
      POSTGRES_USER: lingcoo
      POSTGRES_PASSWORD: lingcoo_password
    ports:
      - '5436:5432'
    volumes:
      - lingcoo_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  lingcoo_postgres_data:
